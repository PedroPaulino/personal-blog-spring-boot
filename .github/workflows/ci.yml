name: Personal Blog CI

on:
    push:
        branches:
            - main

    pull_request:
        branches:
            - main

permissions:
  contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Setup Java 17
              uses: actions/setup-java@v4
              with:
                distribution: temurin
                java-version: '17'
                cache: maven

            - name: Grant Execute Permission
              run: chmod +x mvnw
            
            - name: Check test configuration
              run: |
                echo "=== Test resources ==="
                find src/test/resources -type f -print

                echo "=== Application-test.properties ==="
                cat src/test/resources/application-test.properties

            - name: Build Project
              run: ./mvnw clean verify

            - name: Upload JaCoCo Report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                name: jacoco-report
                path: target/site/jacoco/
                retention-days: 14