name: Personal Blog CI

on:
    push:
        branches:
            - main

    pull_request:
        branches:
            - main
jobs:
    build:
        runs-on: ubuntu-latest
        
        steps:
            - name: checkout repository
              uses: actions/checkout@v4

            - name: Setup Java 17
              uses: actions/setup-java@v4
              with:
                distribution: temurin
                java-version: '17'
                cache: maven

            - name: Grant execute permission
              run: chmod +x mvnw

            - name: Build and Test
              run: mvnw clean verify